version: '3.8'

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${DB_DATABASE:-ksystems}
      MYSQL_USER: ${DB_USERNAME:-ksystems}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/var/www/html/uploads
      - social_data:/var/www/social-private
    environment:
      CAD_ENABLED: ${CAD_ENABLED:-true}
      SOCIAL_ENABLED: ${SOCIAL_ENABLED:-false}
      SOCIAL_ORIGIN: ${SOCIAL_ORIGIN:-}
      SOCIAL_STORAGE_PATH: /var/www/social-private
      SOCIAL_STORAGE: ${SOCIAL_STORAGE:-local}
      SOCIAL_S3_ENDPOINT: ${SOCIAL_S3_ENDPOINT:-}
      SOCIAL_S3_REGION: ${SOCIAL_S3_REGION:-us-east-1}
      SOCIAL_S3_BUCKET: ${SOCIAL_S3_BUCKET:-}
      SOCIAL_S3_KEY: ${SOCIAL_S3_KEY:-}
      SOCIAL_S3_SECRET: ${SOCIAL_S3_SECRET:-}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ksystems}
      DB_USERNAME: ${DB_USERNAME:-ksystems}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      APP_ENV: ${APP_ENV:-production}
      NODE_ENV: ${NODE_ENV:-production}
      SOCKET_SERVER_URL: http://socket-server:3001
      SOCKET_API_KEY: ${SOCKET_API_KEY:?SOCKET_API_KEY must be set}
      APP_URL_PROD: https://${DOMAIN}/api
      FRONTEND_URL_PROD: https://${DOMAIN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      COOKIE_DOMAIN: ${DOMAIN}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "Lax"
      UPLOAD_BASE_DIR: /var/www/html/uploads
      PUBLIC_UPLOAD_URL: https://${DOMAIN}/uploads
      DOCUMENT_IMAGE_STORAGE_PATH: /var/www/html/uploads/documents
      DOCUMENT_IMAGE_PUBLIC_URL: https://${DOMAIN}/uploads/documents
    networks:
      - web
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.backend-${STACK_NAME}.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))
      - traefik.http.routers.backend-${STACK_NAME}.entrypoints=websecure
      - traefik.http.routers.backend-${STACK_NAME}.tls=true
      - traefik.http.routers.backend-${STACK_NAME}.tls.certresolver=letsencrypt
      - traefik.http.routers.backend-${STACK_NAME}.priority=10
      - traefik.http.services.backend-${STACK_NAME}.loadbalancer.server.port=80
      - traefik.http.routers.backend-http-${STACK_NAME}.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))
      - traefik.http.routers.backend-http-${STACK_NAME}.entrypoints=web
      - traefik.http.routers.backend-http-${STACK_NAME}.middlewares=https-redirect@docker
      - traefik.http.routers.backend-http-${STACK_NAME}.priority=10

  socket-server:
    build:
      context: ./socket-server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}
      API_KEY: ${SOCKET_API_KEY:?SOCKET_API_KEY must be set}
      JWT_SECRET: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      CORS_ORIGIN: https://${DOMAIN}
      PHP_API_URL: http://backend:80
      DEBUG: "false"
      LOG_LEVEL: info
    command: ["node", "server.js"]
    networks:
      - web
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.socket-${STACK_NAME}.rule=Host(`${DOMAIN}`) && PathPrefix(`/socket.io`)
      - traefik.http.routers.socket-${STACK_NAME}.entrypoints=websecure
      - traefik.http.routers.socket-${STACK_NAME}.tls=true
      - traefik.http.routers.socket-${STACK_NAME}.tls.certresolver=letsencrypt
      - traefik.http.routers.socket-${STACK_NAME}.priority=10
      - traefik.http.services.socket-${STACK_NAME}.loadbalancer.server.port=3001
      - traefik.http.routers.socket-http-${STACK_NAME}.rule=Host(`${DOMAIN}`) && PathPrefix(`/socket.io`)
      - traefik.http.routers.socket-http-${STACK_NAME}.entrypoints=web
      - traefik.http.routers.socket-http-${STACK_NAME}.middlewares=https-redirect@docker
      - traefik.http.routers.socket-http-${STACK_NAME}.priority=10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SOCIAL_URL: ${SOCIAL_URL:-}
        VITE_SOCIAL_ENABLED: ${SOCIAL_ENABLED:-false}
        VITE_API_URL: https://${DOMAIN}/api
        VITE_SOCKET_URL: wss://${DOMAIN}/socket.io
        VITE_REDIRECT_URL: https://${DOMAIN}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.frontend-${STACK_NAME}.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend-${STACK_NAME}.entrypoints=websecure
      - traefik.http.routers.frontend-${STACK_NAME}.tls=true
      - traefik.http.routers.frontend-${STACK_NAME}.tls.certresolver=letsencrypt
      - traefik.http.routers.frontend-${STACK_NAME}.priority=1
      - traefik.http.services.frontend-${STACK_NAME}.loadbalancer.server.port=80
      - traefik.http.routers.frontend-http-${STACK_NAME}.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend-http-${STACK_NAME}.entrypoints=web
      - traefik.http.routers.frontend-http-${STACK_NAME}.middlewares=https-redirect@docker
      - traefik.http.routers.frontend-http-${STACK_NAME}.priority=1
    healthcheck:
      disable: true

  social:
    profiles: [social]
    build: ./social
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.social-${STACK_NAME}.rule=Host(`${SOCIAL_DOMAIN:-social.localhost}`)
      - traefik.http.routers.social-${STACK_NAME}.entrypoints=websecure
      - traefik.http.routers.social-${STACK_NAME}.tls=true
      - traefik.http.routers.social-${STACK_NAME}.tls.certresolver=letsencrypt
      - traefik.http.services.social-${STACK_NAME}.loadbalancer.server.port=80

  social-worker:
    profiles: [social]
    build: ./backend
    restart: unless-stopped
    # This CLI worker has no Apache process; do not inherit the image HTTP probe.
    healthcheck:
      disable: true
    entrypoint: ["php", "/var/www/html/social/worker.php"]
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - social_data:/var/www/social-private
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ksystems}
      DB_USERNAME: ${DB_USERNAME:-ksystems}
      DB_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
      SOCIAL_ENABLED: ${SOCIAL_ENABLED:-false}
      SOCIAL_STORAGE_PATH: /var/www/social-private
      SOCIAL_STORAGE: ${SOCIAL_STORAGE:-local}
      SOCIAL_S3_ENDPOINT: ${SOCIAL_S3_ENDPOINT:-}
      SOCIAL_S3_REGION: ${SOCIAL_S3_REGION:-us-east-1}
      SOCIAL_S3_BUCKET: ${SOCIAL_S3_BUCKET:-}
      SOCIAL_S3_KEY: ${SOCIAL_S3_KEY:-}
      SOCIAL_S3_SECRET: ${SOCIAL_S3_SECRET:-}
    networks:
      - internal

volumes:
  social_data:
  db_data:
  uploads_data:

networks:
  web:
    external: true
  internal:
    driver: bridge
