# .github/workflows/docker-image.yml
# Baut alle drei Service-Images, um Dockerfile- und Dependency-Fehler
# zu finden, bevor sie beim Deployment auf dem Server auftreten.
#
# Bewusst NICHT "Docker Build and Push" genannt: deploy-staging.yml und
# deploy-production.yml haengen per workflow_run an diesem Namen und wuerden
# sonst ein SSH-Deployment ausloesen. Dieser Workflow pusht keine Images
# und deployt nichts.

name: Docker Build Check

on:
  push:
    branches: [master, main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            build-args: ""
          - service: socket-server
            context: ./socket-server
            build-args: ""
          - service: frontend
            context: ./frontend
            # Platzhalter-URLs: der Build soll nur validiert werden,
            # das Image wird nicht veroeffentlicht.
            build-args: |
              VITE_API_URL=https://build-check.invalid/api
              VITE_SOCKET_URL=wss://build-check.invalid/socket.io
              VITE_REDIRECT_URL=https://build-check.invalid

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          build-args: ${{ matrix.build-args }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
