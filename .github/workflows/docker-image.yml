version: '3.8'

services:
  # MySQL Datenbank
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ksystems}
      MYSQL_USER: ${MYSQL_USER:-ksystems}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ksystems_password}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  # PHP Backend mit Apache
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - uploads_data:/var/www/html/uploads
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-ksystems}
      DB_USERNAME: ${MYSQL_USER:-ksystems}
      DB_PASSWORD: ${MYSQL_PASSWORD:-ksystems_password}
      APP_ENV: ${APP_ENV:-production}
      NODE_ENV: ${NODE_ENV:-production}
      SOCKET_SERVER_URL: http://socket-server:3001
      SOCKET_API_KEY: ${SOCKET_API_KEY:-socket_api_key}
      APP_URL_PROD: https://${DOMAIN:-localhost}/api
      FRONTEND_URL_PROD: https://${DOMAIN:-localhost}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt_secret_key}
    ports:
      - "${BACKEND_HOST_PORT:-9080}:80"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "[ -f /var/www/html/index.php ] || exit 1"]
      start_period: 30s

  # Node.js Socket Server
  socket-server:
    build:
      context: ./socket-server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}
      API_KEY: ${SOCKET_API_KEY:-socket_api_key}
      JWT_SECRET: ${JWT_SECRET_KEY:-jwt_secret_key}
      CORS_ORIGIN: https://${DOMAIN:-localhost}
      PHP_API_URL: http://backend:80
    ports:
      - "${SOCKET_HOST_PORT:-9001}:3001"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "lsof -i :3001 || exit 1"]
      start_period: 10s

  # Vue.js/Vite Frontend mit Nginx
  frontend:
    # Einfache NGINX-Konfiguration statt komplexem Build
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./frontend/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "${FRONTEND_HOST_PORT:-9173}:80"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "[ -d /usr/share/nginx/html ] || exit 1"]
      start_period: 10s

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local