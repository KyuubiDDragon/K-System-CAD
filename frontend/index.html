<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Systems</title>
    <!-- Debug-Utilities inline laden, bevor irgendwelche Module geladen werden -->
    <script>
      // Originale Konsolenmethoden speichern
      const originalConsole = {
        log: console.log,
        warn: console.warn,
        error: console.error,
        info: console.info,
        debug: console.debug
      };

      // Debug-Modus prüfen
      function isDebugMode() {
        const urlParams = new URLSearchParams(window.location.search);
        const debugParam = urlParams.get('debugMode');
        const storedDebug = localStorage.getItem('debugMode');
        
        return debugParam === '1' || storedDebug === '1';
      }

      // Debug-Modus einrichten
      function setupDebugMode() {
        const urlParams = new URLSearchParams(window.location.search);
        const debugParam = urlParams.get('debugMode');
        
        // URL-Parameter in localStorage speichern
        if (debugParam === '1') {
          localStorage.setItem('debugMode', '1');
        } else if (debugParam === '0') {
          localStorage.removeItem('debugMode');
        }
        
        // Wenn Debug-Modus deaktiviert ist, Logs unterdrücken
        if (!isDebugMode()) {
          console.log = function() {};
          console.info = function() {};
          console.debug = function() {};
        } else {
          // Bei aktiviertem Debug-Modus originale Methoden wiederherstellen
          console.log = originalConsole.log;
          console.info = originalConsole.info;
          console.debug = originalConsole.debug;
        }
      }

      // Debug-Modus umschalten
      function toggleDebugMode() {
        if (isDebugMode()) {
          localStorage.removeItem('debugMode');
        } else {
          localStorage.setItem('debugMode', '1');
        }
        setupDebugMode();
        return isDebugMode();
      }

      // Debug-Panel anzeigen
      function showDebugPanel() {
        // Debug-Panel erstellen, wenn es noch nicht existiert
        if (!window._debugPanel) {
          const panel = document.createElement('div');
          panel.style.position = 'fixed';
          panel.style.bottom = '10px';
          panel.style.right = '10px';
          panel.style.width = '300px';
          panel.style.backgroundColor = 'rgba(0,0,0,0.8)';
          panel.style.color = 'white';
          panel.style.padding = '15px';
          panel.style.borderRadius = '5px';
          panel.style.zIndex = '9999';
          panel.style.fontFamily = 'monospace';
          
          const title = document.createElement('h3');
          title.textContent = 'Debug Control Panel';
          title.style.margin = '0 0 10px 0';
          
          const status = document.createElement('div');
          status.textContent = `Debug Mode: ${isDebugMode() ? 'ENABLED' : 'DISABLED'}`;
          status.style.marginBottom = '10px';
          
          const toggleBtn = document.createElement('button');
          toggleBtn.textContent = isDebugMode() ? 'Disable Debug Mode' : 'Enable Debug Mode';
          toggleBtn.style.padding = '5px 10px';
          toggleBtn.style.marginRight = '10px';
          toggleBtn.addEventListener('click', () => {
            const enabled = toggleDebugMode();
            status.textContent = `Debug Mode: ${enabled ? 'ENABLED' : 'DISABLED'}`;
            toggleBtn.textContent = enabled ? 'Disable Debug Mode' : 'Enable Debug Mode';
          });
          
          const closeBtn = document.createElement('button');
          closeBtn.textContent = 'Close';
          closeBtn.style.padding = '5px 10px';
          closeBtn.addEventListener('click', () => {
            document.body.removeChild(panel);
            window._debugPanel = null;
          });
          
          panel.appendChild(title);
          panel.appendChild(status);
          panel.appendChild(toggleBtn);
          panel.appendChild(closeBtn);
          
          document.body.appendChild(panel);
          window._debugPanel = panel;
        }
      }

      // Global verfügbar machen
      window.$debugLogger = {
        isDebugMode,
        setup: setupDebugMode,
        toggle: toggleDebugMode,
        getStatus: () => ({
          enabled: isDebugMode(),
          storageSetting: localStorage.getItem('debugMode'),
          urlParameter: new URLSearchParams(window.location.search).get('debugMode')
        })
      };

      window.$debugHelper = {
        toggleDebugPanel: showDebugPanel,
        toggleDebugMode,
        countLogs: () => {
          alert('Ungefähr 533 console.log Anweisungen in 56 Dateien gefunden');
          console.log('Ungefähr 533 console.log Anweisungen in 56 Dateien gefunden');
        }
      };

      // Debug-Modus sofort einrichten
      setupDebugMode();

      // Tastatur-Shortcut hinzufügen (Ctrl+Shift+D)
      document.addEventListener('DOMContentLoaded', function() {
        document.addEventListener('keydown', function(event) {
          if (event.ctrlKey && event.shiftKey && event.key === 'D') {
            event.preventDefault();
            showDebugPanel();
          }
        });
        
        console.log(`Debug-Utilities installiert (debugMode=${isDebugMode()})`);
        // Developer-only hint, no translation required
        console.log('Drücke Ctrl+Shift+D, um das Debug-Panel anzuzeigen');
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
