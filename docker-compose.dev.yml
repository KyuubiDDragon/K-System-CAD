# Docker Compose - Local Development (without Traefik)
# Usage: docker-compose -f docker-compose.dev.yml up -d
#
# Access:
#   Frontend:      http://localhost:5173
#   Backend API:   http://localhost:8080
#   Socket Server: http://localhost:3001
#   Database:      localhost:3307

version: '3.8'

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-CHANGE_ME}
      MYSQL_DATABASE: ksystems
      MYSQL_USER: ksystems
      MYSQL_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-CHANGE_ME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/var/www/html/uploads
      - social_data:/var/www/social-private
    environment:
      CAD_ENABLED: ${CAD_ENABLED:-true}
      SOCIAL_ENABLED: ${SOCIAL_ENABLED:-false}
      SOCIAL_ORIGIN: ${SOCIAL_ORIGIN:-}
      SOCIAL_STORAGE_PATH: /var/www/social-private
      SOCIAL_STORAGE: ${SOCIAL_STORAGE:-local}
      SOCIAL_S3_ENDPOINT: ${SOCIAL_S3_ENDPOINT:-}
      SOCIAL_S3_REGION: ${SOCIAL_S3_REGION:-us-east-1}
      SOCIAL_S3_BUCKET: ${SOCIAL_S3_BUCKET:-}
      SOCIAL_S3_KEY: ${SOCIAL_S3_KEY:-}
      SOCIAL_S3_SECRET: ${SOCIAL_S3_SECRET:-}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ksystems
      DB_USERNAME: ksystems
      DB_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
      APP_ENV: development
      SOCKET_SERVER_URL: http://socket-server:3001
      SOCKET_API_KEY: ${SOCKET_API_KEY:-CHANGE_ME}
      APP_URL_PROD: http://localhost:8080
      FRONTEND_URL_PROD: http://localhost:5173
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-CHANGE_ME}
      COOKIE_DOMAIN: localhost
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: "Lax"
      UPLOAD_BASE_DIR: /var/www/html/uploads
      PUBLIC_UPLOAD_URL: http://localhost:8080/uploads
      DOCUMENT_IMAGE_STORAGE_PATH: /var/www/html/uploads/documents
      DOCUMENT_IMAGE_PUBLIC_URL: http://localhost:8080/uploads/documents
    networks:
      - internal

  socket-server:
    build:
      context: ./socket-server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - backend
    environment:
      PORT: 3001
      NODE_ENV: development
      API_KEY: ${SOCKET_API_KEY:-CHANGE_ME}
      JWT_SECRET: ${JWT_SECRET_KEY:-CHANGE_ME}
      CORS_ORIGIN: http://localhost:5173
      PHP_API_URL: http://backend:80
      DEBUG: "true"
      LOG_LEVEL: debug
    command: ["node", "server.js"]
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SOCIAL_URL: ${SOCIAL_URL:-}
        VITE_SOCIAL_ENABLED: ${SOCIAL_ENABLED:-false}
        VITE_API_URL: http://localhost:8080/api
        VITE_SOCKET_URL: ws://localhost:3001/socket.io
        VITE_REDIRECT_URL: http://localhost:5173
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - internal

  social:
    profiles: [social]
    build: ./social
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5174:80"
    networks:
      - internal

  social-worker:
    profiles: [social]
    build: ./backend
    restart: unless-stopped
    # This CLI worker has no Apache process; do not inherit the image HTTP probe.
    healthcheck:
      disable: true
    entrypoint: ["php", "/var/www/html/social/worker.php"]
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - social_data:/var/www/social-private
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ksystems
      DB_USERNAME: ksystems
      DB_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
      SOCIAL_ENABLED: ${SOCIAL_ENABLED:-false}
      SOCIAL_STORAGE_PATH: /var/www/social-private
      SOCIAL_STORAGE: ${SOCIAL_STORAGE:-local}
      SOCIAL_S3_ENDPOINT: ${SOCIAL_S3_ENDPOINT:-}
      SOCIAL_S3_REGION: ${SOCIAL_S3_REGION:-us-east-1}
      SOCIAL_S3_BUCKET: ${SOCIAL_S3_BUCKET:-}
      SOCIAL_S3_KEY: ${SOCIAL_S3_KEY:-}
      SOCIAL_S3_SECRET: ${SOCIAL_S3_SECRET:-}
    networks:
      - internal

volumes:
  social_data:
  db_data:
  uploads_data:

networks:
  internal:
    driver: bridge
