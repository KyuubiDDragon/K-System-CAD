; /path/to/your/project/uploads.ini
file_uploads = On
upload_max_filesize = 50M  ; Beispiel: 50 Megabytes
post_max_size = 55M        ; Muss größer oder gleich upload_max_filesize sein
max_file_uploads = 20      ; Maximale Anzahl von Dateien pro Request (Standard ist 20)
; upload_tmp_dir = /tmp    ; Optional: Standardmäßig verwendet PHP das System-Temporärverzeichnis