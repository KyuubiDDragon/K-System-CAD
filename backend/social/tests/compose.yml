name: kyuubi-social-test
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: social-test-only
      MARIADB_DATABASE: social_test
      MARIADB_USER: social_test
      MARIADB_PASSWORD: social-test-only
    tmpfs: /var/lib/mysql
    volumes:
      - ../../../database/database.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 3s
      retries: 40
  backend:
    image: kyuubi-social-backend-dev
    ports: ["127.0.0.1:${SOCIAL_TEST_PORT:-8088}:80"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_DATABASE: social_test
      DB_USERNAME: social_test
      DB_PASSWORD: social-test-only
      SOCIAL_ENABLED: "true"
      SOCIAL_ORIGIN: "http://127.0.0.1:${SOCIAL_TEST_UI_PORT:-5186}"
      FRONTEND_URL_PROD: "http://127.0.0.1:${SOCIAL_TEST_PORT:-8087}"
      CAD_ENABLED: "true"
      SOCIAL_STORAGE_PATH: /var/www/social-private
      COOKIE_SECURE: "false"
      APP_ENV: production
      JWT_SECRET_KEY: local-test-not-for-production
    volumes:
      - ../:/var/www/html/social:ro
      - ../../bootstrap.php:/var/www/html/bootstrap.php:ro
      - ../../laws:/var/www/html/laws:ro
      - ../../helpers:/var/www/html/helpers:ro
      - ../../admin/roles:/var/www/html/admin/roles:ro
    tmpfs:
      - /var/www/social-private:mode=0777

  social:
    profiles: [browser]
    build: ../../../social
    environment:
      CAD_FRAME_ORIGIN: "http://127.0.0.1:${SOCIAL_TEST_PORT:-8087}"
    ports: ["127.0.0.1:${SOCIAL_TEST_UI_PORT:-5186}:80"]
    depends_on:
      backend:
        condition: service_healthy
